<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set a new password — CreoTask</title>
  <meta name="theme-color" content="#071214" />
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Cinzel:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/ds.css" />
  <link rel="stylesheet" href="/assets/css/pages/auth.css" />
</head>
<body class="ui">
  <main class="auth-page">
    <div class="auth-panel" data-page="reset">
      <a class="ui-brand" href="/" aria-label="CreoTask home"><img src="/assets/img/logo.svg" alt="" width="30" height="30" /><span>CREOTASK</span></a>
      <div class="ui-card"><div class="ui-card__body">
        <div class="auth-status" id="stateForm">
          <h1 class="ui-h2">Set a new password</h1>
          <p class="ui-text-2">You'll be signed out on every device, then you can log in with the new password.</p>
        </div>
        <form class="ui-stack" id="resetForm" novalidate>
          <div class="ui-field">
            <label class="ui-label" for="password">New password</label>
            <input class="ui-input" type="password" id="password" autocomplete="new-password" required aria-describedby="pwHint" />
            <p class="ui-hint" id="pwHint">At least 8 characters, with a letter and a number.</p>
          </div>
          <div class="ui-field">
            <label class="ui-label" for="confirmPassword">Confirm new password</label>
            <input class="ui-input" type="password" id="confirmPassword" autocomplete="new-password" required />
          </div>
          <p class="ui-error" id="formError" role="alert"></p>
          <button class="ui-btn ui-btn--primary ui-btn--block" type="submit" id="submitBtn">Set new password</button>
        </form>
        <div class="auth-status" id="stateSuccess" hidden>
          <span class="ui-badge ui-badge--success ui-badge--dot">Password set</span>
          <h1 class="ui-h2">Your password is set</h1>
          <p class="ui-text-2">All devices were signed out. Log in with your new password.</p>
          <a class="ui-btn ui-btn--primary" href="/index.html?auth=signin">Log in</a>
        </div>
      </div></div>
    </div>
  </main>
  <script src="/assets/js/auth-pages.js"></script>
</body>
</html>
